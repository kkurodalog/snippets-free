<!DOCTYPE html>
<html lang="ja" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>読了率のバー｜スクロール演出</title>

    <!--
      JS が読み込まれる前に html の class を no-js → js へ書き換える。
      head 内のインラインスクリプトで実行することで、画面描画前に切り替わる。

      ただし、このスクロール進捗バーは 001/002 の出現演出と性質が異なる。
      出現演出（fade-in / stagger）は「JS が要素を表示状態にしないと
      コンテンツが隠れたまま」になるため、JS 前提を no-js / js で厳密に
      切り分ける必要があった。
      一方この進捗バーは、対応ブラウザでは CSS の animation-timeline: scroll()
      だけでスクロールに連動して動くため、JS は「非対応ブラウザ向けの保険」
      にすぎない。よって no-js / js を進捗バーの表示可否には使わない。
      （no-js / js クラス自体は同シリーズの作法に揃えて付与しておく。）
    -->
    <script>
      document.documentElement.classList.remove("no-js");
      document.documentElement.classList.add("js");
    </script>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <!-- snippet:start -->
    <div
      class="c-progress"
      data-progress-bar
      role="progressbar"
      aria-label="ページの読了率"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <span class="c-progress__bar"></span>
    </div>
    <!-- snippet:end -->

    <main class="l-main">
      <section class="p-section">
        <!-- デモ専用クローム: 進捗の動きを最初から見直すための再読み込みボタン（スニペット範囲外） -->
        <button
          type="button"
          class="p-section__reload"
          onclick="location.reload()"
        >
          ページを再読み込み
        </button>

        <h2 class="p-section__title">
          下にスクロールすると画面上部のバーが進む
        </h2>
        <p class="p-section__text">
          ページの終わりでバーは右端まで伸びます。
        </p>

        <!-- スクロール量を確保するためのダミーコンテンツ（デモ用 / スニペット範囲外）。
             縦に十分長いセクションを並べ、読了率の変化を体感できるようにする。 -->
        <div class="p-dummy">
          <section class="p-dummy__block">
            <p class="p-dummy__text">テキストが入ります。</p>
          </section>
          <section class="p-dummy__block">
            <p class="p-dummy__text">テキストが入ります。</p>
          </section>
          <section class="p-dummy__block">
            <p class="p-dummy__text">テキストが入ります。</p>
          </section>
          <section class="p-dummy__block">
            <p class="p-dummy__text">テキストが入ります。</p>
          </section>
          <section class="p-dummy__block">
            <p class="p-dummy__text">テキストが入ります。</p>
          </section>
          <section class="p-dummy__block">
            <p class="p-dummy__text">テキストが入ります。</p>
          </section>
        </div>
      </section>
    </main>

    <script src="./assets/js/script.js" defer></script>
  </body>
</html>
