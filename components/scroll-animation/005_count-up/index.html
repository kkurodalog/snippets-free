<!DOCTYPE html>
<html lang="ja" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字を数え上げる｜スクロール演出</title>

    <!--
      JS が読み込まれる前に html の class を no-js → js へ書き換える。
      head 内のインラインスクリプトで実行することで、画面描画前に
      切り替わり、初期状態のチラつき（FOUC）を防ぐ。
      JS 無効環境・このスクリプトが届かない環境では no-js のままになり、
      CSS 側で数値を最初から最終値で表示する（情報の欠落を防ぐ）。
    -->
    <script>
      document.documentElement.classList.remove("no-js");
      document.documentElement.classList.add("js");
    </script>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="l-main">
      <section class="p-section">
        <!-- デモ専用クローム: カウント演出を見直すための再読み込みボタン（スニペット範囲外） -->
        <button
          type="button"
          class="p-section__reload"
          onclick="location.reload()"
        >
          ページを再読み込み
        </button>

        <h2 class="p-section__title">
          フレームインすると数字が0から動き出す
        </h2>
        <!-- 数値が画面に入る瞬間を見せるための前置き（デモ用 / スニペット範囲外）。
             これを外すと数値が画面の中へ入り、読み込んだ時点で数え終わってしまう。
             実測（375x800）: この1本があると初期表示は 0 のままで、
             スクロールして初めて数え上がる。 -->
        <p class="p-section__lead">下にスクロール↓</p>

        <!-- snippet:start -->
        <ul class="c-count">
          <li class="c-count__item">
            <span
              class="c-count__value"
              data-count-up
              data-count-up-to="1200"
              data-count-up-suffix="+"
              >1,200+</span
            >
            <span class="c-count__label">導入企業</span>
          </li>

          <li class="c-count__item">
            <span
              class="c-count__value"
              data-count-up
              data-count-up-to="98"
              data-count-up-suffix="%"
              >98%</span
            >
            <span class="c-count__label">満足度</span>
          </li>

          <li class="c-count__item">
            <span
              class="c-count__value"
              data-count-up
              data-count-up-to="50000"
              data-count-up-duration="2600"
              >50,000</span
            >
            <span class="c-count__label">累計ダウンロード</span>
          </li>

          <li class="c-count__item">
            <span
              class="c-count__value"
              data-count-up
              data-count-up-to="4.8"
              data-count-up-decimals="1"
              >4.8</span
            >
            <span class="c-count__label">平均評価</span>
          </li>
        </ul>
        <!-- snippet:end -->
      </section>
    </main>

    <script src="./assets/js/script.js" defer></script>
  </body>
</html>
