<!DOCTYPE html>
<html lang="ja" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ふわっと出現する｜スクロール演出</title>

    <!--
      JS が読み込まれる前に html の class を no-js → js へ書き換える。
      head 内のインラインスクリプトで実行することで、画面描画前に
      切り替わり、初期状態のチラつき（FOUC）を防ぐ。
      JS 無効環境・このスクリプトが届かない環境では no-js のままになり、
      CSS 側で要素を最初から表示状態にする（コンテンツ消失を防ぐ）。
    -->
    <script>
      document.documentElement.classList.remove("no-js");
      document.documentElement.classList.add("js");
    </script>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="l-main">
      <section class="p-section">
        <!-- デモ専用クローム: 出現演出を見直すための再読み込みボタン（スニペット範囲外） -->
        <button
          type="button"
          class="p-section__reload"
          onclick="location.reload()"
        >
          ページを再読み込み
        </button>

        <!-- snippet:start -->
        <script>
          document.documentElement.classList.remove("no-js");
          document.documentElement.classList.add("js");
        </script>

        <div class="c-fade">
          <h2 class="c-fade__heading" data-fade-in>
            下からフェードイン表示
          </h2>

          <h2 class="c-fade__heading" data-fade-in data-fade-in-direction="left">
            左からフェードイン表示
          </h2>

          <h2 class="c-fade__heading" data-fade-in data-fade-in-direction="right">
            右からフェードイン表示
          </h2>

          <h2 class="c-fade__heading" data-fade-in data-fade-in-direction="none">
            動かずフェードイン表示
          </h2>

          <div class="c-fade__group">
            <h2 class="c-fade__group-title">カードごとにフェードイン表示</h2>

            <ul class="c-fade__list">
              <li class="c-fade__card" data-fade-in>
                <h3 class="c-fade__card-title">見出しが入ります</h3>
                <p class="c-fade__text">テキストが入ります。</p>
              </li>
              <li class="c-fade__card" data-fade-in>
                <h3 class="c-fade__card-title">見出しが入ります</h3>
                <p class="c-fade__text">テキストが入ります。</p>
              </li>
              <li class="c-fade__card" data-fade-in>
                <h3 class="c-fade__card-title">見出しが入ります</h3>
                <p class="c-fade__text">テキストが入ります。</p>
              </li>
            </ul>
          </div>
        </div>
        <!-- snippet:end -->
      </section>
    </main>

    <script src="./assets/js/script.js" defer></script>
  </body>
</html>
