<!DOCTYPE html>
<html lang="ja" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1つだけ開く｜アコーディオン</title>
    <!--
      JS が読み込まれる前に html の class を no-js → js へ書き換える。
      head 内のインラインスクリプトで実行することで画面描画前に切り替わり、
      閉じた初期状態のちらつき（FOUC）を防ぐ。
      JS 無効環境ではこのスクリプトが走らず no-js のままになり、
      CSS 側で本文が最初から開いた状態で表示される（コンテンツ消失を防ぐ）。
    -->
    <script>
      document.documentElement.classList.remove("no-js");
      document.documentElement.classList.add("js");
    </script>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="l-main">
      <!-- snippet:start -->
      <script>
        document.documentElement.classList.remove("no-js");
        document.documentElement.classList.add("js");
      </script>

      <div class="c-accordion" data-single-open id="c-accordion-single-open">
        <div class="c-accordion__item">
          <h2 class="c-accordion__heading">
            <span class="c-accordion__title">ご利用の流れ</span>
          </h2>
          <div class="c-accordion__body" id="c-accordion-single-panel-1">
            <div class="c-accordion__content">
              <p>
                お申し込みからご利用開始までの流れをまとめています。手順ごとに、必要なものと用意しておくとよい情報を記載します。
              </p>
            </div>
          </div>
        </div>

        <div class="c-accordion__item">
          <h2 class="c-accordion__heading">
            <span class="c-accordion__title">お支払い方法</span>
          </h2>
          <div class="c-accordion__body" id="c-accordion-single-panel-2">
            <div class="c-accordion__content">
              <p>
                ご利用いただけるお支払い方法と、支払いのタイミングをまとめています。手続きの締め切りは方法によって異なります。
              </p>
            </div>
          </div>
        </div>

        <div class="c-accordion__item">
          <h2 class="c-accordion__heading">
            <span class="c-accordion__title">配送と受け取り</span>
          </h2>
          <div class="c-accordion__body" id="c-accordion-single-panel-3">
            <div class="c-accordion__content">
              <p>
                お届けまでの目安と、受け取り方法の選び方をまとめています。日時の指定や再配達の手続きについても案内します。
              </p>
            </div>
          </div>
        </div>

        <div class="c-accordion__item">
          <h2 class="c-accordion__heading">
            <span class="c-accordion__title">返品と交換</span>
          </h2>
          <div class="c-accordion__body" id="c-accordion-single-panel-4">
            <div class="c-accordion__content">
              <p>
                返品と交換を受け付ける条件と、手続きの手順をまとめています。商品の状態によっては対応できない場合があります。
              </p>
            </div>
          </div>
        </div>
      </div>
      <!-- snippet:end -->
    </main>

    <script src="./assets/js/script.js" defer></script>
  </body>
</html>
