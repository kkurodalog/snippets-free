<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>002_details-basic</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="l-main">
      <!-- snippet:start -->
      <div class="c-accordion">
        <details class="c-accordion__item">
          <summary class="c-accordion__header">
            <span class="c-accordion__title">ご利用の流れ</span>
            <span class="c-accordion__icon" aria-hidden="true"></span>
          </summary>
          <div class="c-accordion__body">
            <div class="c-accordion__content">
              <p>
                お申し込みからご利用開始までの流れをまとめています。手順ごとに、必要なものと用意しておくとよい情報を記載します。
              </p>
            </div>
          </div>
        </details>

        <details class="c-accordion__item">
          <summary class="c-accordion__header">
            <span class="c-accordion__title">お支払い方法</span>
            <span class="c-accordion__icon" aria-hidden="true"></span>
          </summary>
          <div class="c-accordion__body">
            <div class="c-accordion__content">
              <p>
                ご利用いただけるお支払い方法と、支払いのタイミングをまとめています。手続きの締め切りは方法によって異なります。
              </p>
            </div>
          </div>
        </details>

        <details class="c-accordion__item">
          <summary class="c-accordion__header">
            <span class="c-accordion__title">配送と受け取り</span>
            <span class="c-accordion__icon" aria-hidden="true"></span>
          </summary>
          <div class="c-accordion__body">
            <div class="c-accordion__content">
              <p>
                お届けまでの目安と、受け取り方法の選び方をまとめています。日時の指定や再配達の手続きについても案内します。
              </p>
            </div>
          </div>
        </details>

        <details class="c-accordion__item">
          <summary class="c-accordion__header">
            <span class="c-accordion__title">返品と交換</span>
            <span class="c-accordion__icon" aria-hidden="true"></span>
          </summary>
          <div class="c-accordion__body">
            <div class="c-accordion__content">
              <p>
                返品と交換を受け付ける条件と、手続きの手順をまとめています。商品の状態によっては対応できない場合があります。
              </p>
            </div>
          </div>
        </details>
      </div>
      <!-- snippet:end -->
    </main>
  </body>
</html>
